name: ZERO MCP
on:
  push:
    paths: ['zero-mcp/**', '.github/workflows/zero-mcp.yml']
  pull_request:
    paths: ['zero-mcp/**', '.github/workflows/zero-mcp.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zero-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zero-mcp/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: node dist/index.js --doctor
