# Голоса персонажей. Финальные голоса фиксируются здесь после кастинга (тест T-01, шаг 6).
foma:
  status: casting
  scratch: {engine: edge-tts, voice: ru-RU-DmitryNeural, rate: "-8%", pitch: "-6Hz", processing: mask}
