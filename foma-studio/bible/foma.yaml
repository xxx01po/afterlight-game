# ПАСПОРТ ПЕРСОНАЖА — ФОМА
# Единственный источник правды. Любое изменение — только по согласованию с автором канала.
# ЭТАЛОН: bible/reference/foma_sheet_v1.png (утверждённый лист персонажа). При расхождении текста и картинки — прав лист.

id: foma
version: 1.0
status: APPROVED_REFERENCE   # лист получен 04.11.2026
change_policy: любые изменения внешности или манеры отрисовки — только после согласования с автором; эталон и дизайна, и стиля — лист foma_sheet_v1.png
previs_dummy: 3D-манекен из previz/ — НЕ эталон визуального качества; используется только для композиции, позы, камеры и тайминга
reference_pack: reference/pack_v1/   # FomaRef_v1 — 4 изображения, порядок важен (см. README)
reference_images:
  sheet: reference/foma_sheet_v1.png
  turnaround: reference/foma_turnaround.png        # перед / 3/4 / профиль / спина, рост ≈175 см
  mask: reference/foma_mask_closeup.png            # маска анфас + профиль
  emotions: reference/foma_emotions.png            # 5 эмоциональных состояний
  details: reference/foma_details.png              # крест на худи, стропы рюкзака, пряжка, кроссовок
  outfit: reference/foma_outfit.png                # худи, карго, рюкзак, кроссовки отдельно
  hero: reference/foma_hero.png                    # ключевой арт (поза сидя, лес, луна, дом с красными окнами)
  palette: reference/foma_palette.png
  atmosphere: reference/foma_atmosphere.png
  logo: reference/foma_logo.png

identity:
  name: Фома
  backstory: НЕ ОПРЕДЕЛЕНА — запрещено придумывать прошлое, происхождение маски и причины появления в местах без согласования
  premise: не помнит прошлого, не знает, откуда у него маска и почему постоянно оказывается в странных и жутких местах; зритель узнаёт мир вместе с ним
  key_traits:            # с листа
    - обычный в реакциях
    - живой и эмоциональный
    - любит докапываться до истины
    - часто попадает в опасные ситуации
    - не знает, кто он на самом деле

personality:
  - говорит естественным живым языком, без литературщины
  - шутит, особенно когда страшно (защитная реакция), немного дерзкий, харизматичный
  - боится, удивляется, злится, паникует
  - ошибается, иногда действует импульсивно; не супергерой

visual:
  height_cm: 175
  build: худощавый молодой парень, фигура полностью скрыта оверсайз-одеждой
  silhouette: капюшон + узкая заострённая маска сверху, объёмное худи, очень широкие карго до пола, светлые массивные кроссовки внизу (светлое пятно — якорь силуэта в темноте)
  head:
    hood: чёрный капюшон ВСЕГДА надет (на всех кадрах листа)
    hair: чёрные растрёпанные острые пряди выбиваются из-под капюшона на лоб и виски
  mask:
    coverage: полностью закрывает лицо
    material: матовая, светло-серая/пепельная (не чисто белая), потёртая, с трещинами
    shape: вытянутый «щит» — широкий лоб, сужается к ЗАОСТРЁННОМУ подбородку; в профиль — изогнутая пластина
    stripe: один чёрный сужающийся клин — начинается широким сверху у лба чуть правее центра (для зрителя при анфасе, т.е. на ЛЕВОЙ стороне Фомы), идёт вниз между глазами и заостряется к низу маски
    cracks: тонкие тёмные трещины — на щеке слева для зрителя (правая щека Фомы) и у нижнего края
    eye_holes: миндалевидные прорези с острыми внешними уголками, слегка «злой» наклон
  eyes:
    color: белое свечение
    glow_hex: "#F4F8FF"
    shape: миндалевидные, внешние уголки вверх
    emotion_language: форма МЕНЯЕТСЯ — сужаются (злость, подозрение), округляются (испуг), прищур-дуга (усмешка)
    default_state: ОБА глаза светятся белым (решение автора 04.11.2026)
    one_eye_fx: один светящийся глаз — только отдельный художественный эффект, если оправдан сценой; помечается в шот-листе как FX_ONE_EYE и согласуется
  clothing:
    hoodie: чёрное оверсайз-худи, карман-кенгуру, шнурки капюшона, нашитый/вышитый крест на груди (деталь листа), потёртости
    pants: очень широкие чёрные штаны карго до пола, большие боковые карманы, свисающие стропы/ремешки
    shoes: массивные светлые (серо-белые, грязные, потёртые) кроссовки с толстой подошвой и тёмными вставками
    backpack: чёрный тактический рюкзак, стропы и пряжки на груди, носится на обоих плечах
  hands: человеческие руки, кожа видна (светлая, в холодном свете — сероватая)
  forbidden_changes:
    - форма маски, положение и форма чёрного клина, трещины
    - геометрия прорезей глаз и цвет свечения
    - одежда, рюкзак, светлые кроссовки
    - пропорции тела, рост, силуэт с капюшоном
    - зеркальное отражение кадров (клин и трещины асимметричны)

style_of_reference: тёмная стилизованная аниме-иллюстрация с кинематографичным светом (холодная луна, красные акценты окон)
# РЕШЕНИЕ АВТОРА 04.11.2026: финальный визуальный стиль фильма = стиль листа (дизайн + манера отрисовки).
# Перевод в другую 3D-подачу (варианты A/B/C) отменён. 3D — только как глубина и движение камеры, объём света и тумана.
final_style_canon: reference/foma_sheet_v1.png

# Дословно вставляется в КАЖДЫЙ промпт с Фомой (англ.) вместе с референс-изображениями.
style_prompt_en: >-
  Dark cinematic anime illustration style exactly like the reference sheet: semi-realistic painterly rendering,
  deep inky blacks, desaturated cold moonlit blues and greys, rare deep red accents, sharp graphic shadows,
  detailed fabric folds, soft volumetric fog and haze, subtle grain, moody horror atmosphere, cinematic depth of field.

lock_prompt_en: >-
  FOMA, a 175 cm tall young guy, always wearing a black oversized hoodie with the hood up,
  messy spiky black hair strands falling from under the hood, a stitched cross detail on the chest, a black tactical
  backpack with chest straps, extremely wide floor-length black cargo pants with big side pockets and hanging straps,
  and chunky worn off-white sneakers with thick soles. His whole face is hidden by a matte ash-grey shield-shaped mask
  with a pointed chin, fine dark cracks, and one tapering black wedge stripe running from the forehead (slightly right
  of center from the viewer) down between the eyes to a point. BOTH almond eye holes with sharp upturned outer corners
  glow pure white. Identical to the reference sheet: same mask, stripe, cracks, eyes, outfit, backpack and sneakers.

lock_negative_en: >-
  mirrored mask, stripe on the wrong side, pure white mask, visible mouth or skin on the face, round cartoon eyes,
  blue or yellow eye glow, hood down, dark sneakers, missing backpack, slim pants, logos, text on clothing, extra fingers

voice:
  status: casting (см. voice/README.md)
  target: мужской, 18–22 по звучанию, средне-низкий, лёгкая хрипотца, разговорный, харизматичный, немного дерзкий, без акцента
